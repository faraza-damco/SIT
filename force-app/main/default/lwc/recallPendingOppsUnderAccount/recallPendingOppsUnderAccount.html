<template>
    <div class="card-container">
        <lightning-card title="Recall Surveillance Opportunity(s)">
                <div slot="actions">
                    <template if:true={showOpportunities}>
                        <lightning-button variant="brand" label="Recall" onclick={handleRecall}></lightning-button>
                    </template>
                </div>

            <template if:true={showOpportunities}>
                <lightning-datatable
                    key-field="Id"
                    data={opportunities}
                    columns={columns}
                    hide-checkbox-column="true">
                </lightning-datatable>
            </template>

            <template if:true={showNoRecords}>
                <p class="slds-text-body_regular slds-text-color_weak slds-p-around_small">
                    This page displays only approval pending surveillance opportunities. If none exists, no data will be shown.
                </p>
            </template>

            <!-- Comment Modal -->
            <template if:true={showCommentModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">Add Comment</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-textarea label="Comments" value={comments} onchange={handleCommentChange} required></lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                            <lightning-button variant="brand" label="Submit" onclick={confirmSubmit}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </lightning-card>
    </div>
</template>
