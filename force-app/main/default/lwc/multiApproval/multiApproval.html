<template>
    <lightning-card title="Bulk Approval Screen" icon-name="standard:approval">
        <!-- Spinner -->
        <template if:true={isLoading}>
            <div class="slds-p-around_medium  slds-text-align_center">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <!-- Main content -->
        <template if:false={isLoading}>
            <div class="slds-p-horizontal_small">
                <lightning-button
                    label="Approve"
                    variant="success"
                    onclick={handleApprove}
                    disabled={isActionDisabled}>
                </lightning-button>
                <lightning-button
                    label="Reject"
                    variant="destructive"
                    onclick={handleReject}
                    disabled={isActionDisabled}
                    class="slds-m-left_small">
                </lightning-button>

                <!-- Opportunity Approvals Header -->
                <div class="slds-m-top_medium">
                    <div class="slds-theme_shade slds-p-around_small">
                        <span class="slds-text-heading_medium slds-text-align_left" style="font-weight:bold;">
                           Pending Surveillance Opportunities
                        </span>
                    </div>
                    <div class="slds-overflow_auto slds-m-top_x-small">
                        <template if:true={hasSurveillanceData}>
                            <lightning-datatable
                                key-field="workItemId"
                                data={surveillanceData}
                                columns={columnsForSurveillance}
                                onrowselection={handleRowSelection}>
                            </lightning-datatable>
                        </template>
                        <template if:false={hasSurveillanceData}>
                            <p class="slds-box slds-text-align_center slds-m-top_medium slds-text-color_weak">No records found.</p>
                        </template>

                    </div>
                </div>

                <!-- Invoice Approvals Header -->
                <div class="slds-m-top_medium">
                    <div class="slds-theme_shade slds-p-around_small">
                        <span class="slds-text-heading_medium slds-text-align_left" style="font-weight:bold;">
                            Pending Proforma Invoices
                        </span>
                    </div>
                    <div class="slds-overflow_auto slds-m-top_x-small">
                        <template if:true={hasProformaInvoiceData}>    
                            <lightning-datatable
                                key-field="workItemId"
                                data={invoiceData}
                                columns={columnsForInvoices}
                                onrowselection={handleRowSelection}>
                            </lightning-datatable>
                        </template>
                        <template if:false={hasProformaInvoiceData}>
                            <p class="slds-box slds-text-align_center slds-m-top_medium slds-text-color_weak">No records found.</p>
                        </template>  
                    </div>
                </div>

                <div class="slds-m-top_medium">
                    <div class="slds-theme_shade slds-p-around_small">
                        <span class="slds-text-heading_medium slds-text-align_left" style="font-weight:bold;">
                            Pending Tax Invoices
                        </span>
                    </div>
                    <div class="slds-overflow_auto slds-m-top_x-small">
                        <template if:true={hasTaxInvoiceData}>
                            <lightning-datatable
                                key-field="workItemId"
                                data={taxInvoiceData}
                                columns={columnsForTaxInvoices}
                                onrowselection={handleRowSelection}>
                            </lightning-datatable>
                        </template>
                        <template if:false={hasTaxInvoiceData}>
                            <p class="slds-box slds-text-align_center slds-m-top_medium slds-text-color_weak">No records found.</p>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>

    <!-- Batch-job status modal -->
    <template if:true={jobStatus}>
        <section role="dialog" tabindex="-1"
                 aria-labelledby="modal-heading-01" aria-modal="true"
                 class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01"
                        class="slds-text-heading_medium">
                        Multiple Approval
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p><b>
                        Approval Done, records updation in process.
                        Kindly refresh before approving again.
                    </b></p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        variant="brand"
                        label="Refresh Page"
                        onclick={handleRefresh}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Reject-reason modal -->
    <template if:true={isRejectReasonModal}>
        <section role="dialog" tabindex="-1"
                 aria-labelledby="reject-modal-heading"
                 aria-modal="true"
                 class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="reject-modal-heading"
                        class="slds-text-heading_medium">
                        Enter Rejection Reason
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea
                        name="rejectionReason"
                        label="Reason for Rejection"
                        value={rejectionReason}
                        onchange={handleReasonChange}
                        required>
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancelReject}>
                    </lightning-button>
                    <lightning-button
                        variant="destructive"
                        label="Submit"
                        onclick={handleConfirmReject}
                        disabled={isSubmitDisabled}
                        class="slds-m-left_small">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
