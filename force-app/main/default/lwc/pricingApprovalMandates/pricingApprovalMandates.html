<template>
    <div>
        <lightning-card>
          <div style="text-align: center;">
            <p style="font-size: large;"><b>{displayValue}</b></p>
            <br>
            <template if:true={showButton}>
                <lightning-button variant="brand" label="Approve" title="Proceed to approve pricing on opportunities" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
                <p style="font-size: small;"><I>*Please check the attachment in email to review all the mandates for bulk approval.</I></p>
            </template>
            <template if:true={showSpinner}>
                <div>
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
          </div>
        </lightning-card>
    </div>
</template>
