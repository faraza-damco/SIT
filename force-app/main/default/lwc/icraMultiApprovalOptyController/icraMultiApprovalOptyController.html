<template>
    <lightning-card title="Pending Opportunities">
        <!-- Top-right action buttons -->
        <div slot="actions" class="slds-p-right_small">
            <lightning-button variant="brand" label="Approve" onclick={handleApproveClick} class="slds-m-right_x-small" disabled={noOpportunities}></lightning-button>
            <lightning-button variant="destructive" label="Reject" onclick={handleRejectClick} disabled={noOpportunities}></lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <!-- Inline comment area (only visible when approving/rejecting) -->
            <template if:true={showCommentArea}>
                <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 id="modal-heading" class="slds-text-heading_medium">{actionLabel}</h2>
                        </header>

                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-textarea
                                label="Comments"
                                value={comments}
                                onchange={handleCommentChange}
                                placeholder="Enter comments">
                            </lightning-textarea>
                        </div>

                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Cancel" onclick={handleCancelAction} class="slds-m-right_small"></lightning-button>
                            <lightning-button variant="brand" label={currentAction} onclick={handleConfirmAction}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>


            <!-- Data table -->
            <lightning-datatable
                key-field="workItemId"
                data={opportunities}
                columns={columns}
                onrowselection={handleRowSelection}
                hide-checkbox-column={hideCheckboxColumn}
                is-loading={loading}>
            </lightning-datatable>

            <!-- No rows message -->
            <template if:true={noOpportunities}>
                <div class="slds-text-body_regular slds-text-color_weak slds-p-top_medium">
                    No pending Opportunities for the provided Account.
                </div>
            </template>
        </div>
    </lightning-card>
</template>
