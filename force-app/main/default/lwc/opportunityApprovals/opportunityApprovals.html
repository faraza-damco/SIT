<template>
    <div class="card-container">
        <lightning-card title="Submit Opportunities for Approval">
                <div slot="actions">
                    <template if:true={showOpportunities}>
                        <lightning-button variant="brand" label="Send" onclick={handleSend}></lightning-button>
                        <!--<lightning-button variant="neutral" label="Recall" onclick={handleRecall} class="slds-m-left_small"></lightning-button>-->
                    </template>
                        

                </div>

            <template if:true={showInactiveUsers}>
                <div class="slds-text-color_weak slds-p-around_small preserve-line-breaks">
                    <p>{inactiveUsersMessage}</p>
                </div>
            </template>

            <template if:true={showOpportunities}>
                <lightning-datatable
                    key-field="Id"
                    data={opportunities}
                    columns={columns}
                    hide-checkbox-column="true">
                </lightning-datatable>
            </template>

            <template if:true={showNoRecords}>
                <p class="slds-text-body_regular slds-text-color_weak slds-p-around_small">
                    This page displays only revised Surveillance opportunities. If none exists, no data will be shown.
                </p>
            </template>

            <!-- Comment Modal -->
            <template if:true={showCommentModal}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">Add Comment</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <lightning-textarea label="Comments" value={comments} onchange={handleCommentChange} required></lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                            <lightning-button variant="brand" label="Submit" onclick={confirmSubmit}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </lightning-card>
    </div>
</template>
